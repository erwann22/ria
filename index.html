<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ria - Dashboard Personnel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Style minimal pour le fond et la structure */
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between p-6">

    <!-- ZONE DE DASHBOARD (Conteneur dynamique) -->
    <main id="dashboard-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 w-full flex-grow items-start overflow-y-auto mb-6">
        <!-- Les composants/widgets de Ria viendront s'injecter ici -->
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl col-span-full text-center py-12">
            <h2 class="text-xl text-slate-400">Que puis-je préparer pour votre dashboard aujourd'hui ?</h2>
        </div>
    </main>

    <!-- ZONE DU PROMPT (Barre de commande) -->
    <footer class="w-full max-w-4xl mx-auto">
        <form id="prompt-form" class="relative flex items-center">
            <input type="text" id="user-input" 
                   class="w-full bg-slate-800 border border-slate-700 rounded-2xl pl-6 pr-16 py-4 text-lg focus:outline-none focus:border-indigo-500 shadow-2xl transition-all"
                   placeholder="Ex: Prépare un widget météo et ma timeline du jour..." autocomplete="off">
            <button type="submit" 
                    class="absolute right-4 bg-indigo-600 hover:bg-indigo-500 text-white p-2 px-4 rounded-xl transition-colors font-medium">
                Ria
            </button>
        </form>
    </footer>

    <script>
        // Logique de capture du prompt (on branchera l'API ici)
        document.getElementById('prompt-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('user-input');
            const query = input.value.trim();
            if (!query) return;

            console.log("Envoi à Ria :", query);
            input.value = '';
            
            // TODO: Envoyer la requête au backend et injecter le HTML reçu dans #dashboard-grid
        });
    </script>
</body>
</html>
